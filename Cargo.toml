[package]
name = "zneo-manager"
version = "0.1.6"
edition = "2021"
description = "Portable Windows manager for the HM LAB Z-NEO 8K USB hub LCD"
license = "AGPL-3.0-or-later"

[[bin]]
name = "ZNeoManager"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "system_fonts"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }
gif = "0.13"
serialport = { version = "4", default-features = false }
crc32fast = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"


single-instance = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Devices_Communication", "Win32_System_IO"] }
winreg = "0.55"
rfd = { version = "0.15", default-features = false }
tray-icon = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
