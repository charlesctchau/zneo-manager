name: Release

# Build the Windows portable zip and publish a GitHub Release, either by pushing a tag
# such as v0.1.7 or by running this workflow manually (Actions > Release > Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.6"
        required: true
        default: "v0.1.6"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Link the C runtime statically so the exe runs on machines without the VC++ redistributable.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $dir = "dist/ZNeo-Manager"
          New-Item -ItemType Directory -Force "$dir/LICENSES" | Out-Null
          Copy-Item target/release/ZNeoManager.exe $dir
          Copy-Item packaging/README.txt $dir/README.txt
          Copy-Item LICENSE "$dir/LICENSES/AGPL-3.0-or-later.txt"
          Copy-Item packaging/NOTICE.txt "$dir/LICENSES/NOTICE.txt"
          Compress-Archive -Path $dir -DestinationPath dist/ZNeo-Manager-win-x64.zip -Force
          $hash = (Get-FileHash dist/ZNeo-Manager-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ZNeo-Manager-win-x64.zip" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.version || github.ref_name }}"
          gh release create $tag `
            dist/ZNeo-Manager-win-x64.zip dist/SHA256SUMS.txt `
            --target "${{ github.sha }}" `
            --title "Z-NEO Manager $tag" `
            --generate-notes `
            --notes "Windows x64 portable build (unsigned: SmartScreen may warn). Close any browser tab with hmlab.tech while using the app, since a COM port can only be opened by one program. AGPL-3.0-or-later; not affiliated with HM LAB."
